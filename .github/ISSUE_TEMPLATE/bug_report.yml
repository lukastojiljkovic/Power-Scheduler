name: Bug report
description: Something in Pwrschdlr doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, follow the [security policy](https://github.com/lukastojiljkovic/Power-Scheduler/security/policy) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set a timer to sleep in 30 minutes
        2. Close Pwrschdlr
        3. ...
    validations:
      required: true
  - type: input
    id: pwrschdlr-version
    attributes:
      label: Pwrschdlr version
      description: Settings > About
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Settings > System > About in Windows
      placeholder: Windows 11 Pro, version 25H2, build 26200
    validations:
      required: true
