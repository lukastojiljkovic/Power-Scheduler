name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What would you like Pwrschdlr to do, and when do you run into it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: How would it work in the app?
    validations:
      required: true
