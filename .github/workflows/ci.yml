name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, test, build and installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format Pwrschdlr.slnx --verify-no-changes

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      # Tests, self-contained publish, third-party licenses and the installer.
      - name: Build
        run: .\build.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: Install and uninstall silently
        run: |
          $setup = (Get-ChildItem artifacts\installer\*.exe).FullName
          # Setup installs for the current user, without administrator rights.
          $app = "$env:LOCALAPPDATA\Programs\Pwrschdlr"
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($install.ExitCode) { throw "Setup failed with exit code $($install.ExitCode)." }
          foreach ($file in 'Pwrschdlr.exe', 'LICENSE.txt', 'TERMS.md', 'PRIVACY.md', 'THIRD-PARTY-NOTICES.md', 'licenses') {
            if (-not (Test-Path "$app\$file")) { throw "Setup didn't install $file." }
          }
          if (-not (Get-ChildItem "$app\licenses")) { throw 'The licenses folder is empty.' }
          Write-Host "Installed $((Get-ChildItem $app -Recurse -File).Count) files."

          # Settings and a timer's task for the uninstaller to remove.
          New-Item -Force HKCU:\Software\Pwrschdlr | New-ItemProperty -Name ShowWelcome -Value 0 -PropertyType DWord | Out-Null
          $task = "Pwrschdlr timer-$([Security.Principal.WindowsIdentity]::GetCurrent().User.Value)"
          schtasks /Create /TN $task /TR "`"$app\Pwrschdlr.exe`" --due $(New-Guid)" /SC ONCE /ST 23:59 /F
          if ($LASTEXITCODE) { throw "Couldn't create the timer task." }

          # The uninstaller hands over to a copy of itself and returns right away, so wait for the app folder to go.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw "The uninstaller left $app behind." }
          if (Test-Path HKCU:\Software\Pwrschdlr) { throw 'The uninstaller left the settings behind.' }
          # Here schtasks failing is the result we want, so its exit code mustn't fail the step.
          schtasks /Query /TN $task 2>$null
          if (-not $LASTEXITCODE) { throw 'The uninstaller left the timer task behind.' }
          $global:LASTEXITCODE = 0
          Write-Host 'Uninstalled cleanly.'
